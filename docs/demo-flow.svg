<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="60" y="70" font-size="34" font-weight="700" fill="#0F172A">Northwind order workflow: what the demo shows</text>
  <text x="60" y="105" font-size="20" fill="#64748B">One workflow per order. Each step is an activity; each undo is registered before its step runs.</text>

  <!-- Workflow container -->
  <rect x="40" y="140" width="1520" height="410" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="64" y="176" font-size="19" font-weight="700" fill="#334155">Workflow  order-&lt;id&gt;</text>

  <text x="105" y="218" font-size="16" fill="#64748B">Forward steps</text>

  <!-- Forward boxes -->
  <g font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">
    <rect x="105" y="230" width="230" height="90" rx="10" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
    <text x="220" y="282">Authorize payment</text>
    <rect x="395" y="230" width="230" height="90" rx="10" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
    <text x="510" y="282">Reserve inventory</text>
    <rect x="685" y="230" width="230" height="90" rx="10" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
    <text x="800" y="282">Create shipping label</text>
    <rect x="975" y="230" width="230" height="90" rx="10" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
    <text x="1090" y="282">Capture payment</text>
    <rect x="1265" y="230" width="230" height="90" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="1380" y="282">Send confirmation</text>
  </g>
  <text x="1380" y="346" font-size="15" fill="#64748B" text-anchor="middle">Outside the saga: a failed email</text>
  <text x="1380" y="366" font-size="15" fill="#64748B" text-anchor="middle">never undoes a paid order</text>

  <!-- Forward arrows -->
  <g stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)">
    <line x1="335" y1="275" x2="393" y2="275"/>
    <line x1="625" y1="275" x2="683" y2="275"/>
    <line x1="915" y1="275" x2="973" y2="275"/>
    <line x1="1205" y1="275" x2="1263" y2="275"/>
  </g>

  <!-- Step-to-undo pairing -->
  <g stroke="#94A3B8" stroke-width="2" stroke-dasharray="3 5">
    <line x1="220" y1="320" x2="220" y2="430"/>
    <line x1="510" y1="320" x2="510" y2="430"/>
    <line x1="800" y1="320" x2="800" y2="430"/>
  </g>

  <rect x="100" y="400" width="250" height="29" fill="#F8FAFC"/>
  <text x="105" y="418" font-size="16" fill="#64748B">Undo steps (saga compensation)</text>

  <!-- Undo boxes -->
  <g font-size="20" font-weight="600" fill="#7F1D1D" text-anchor="middle">
    <rect x="105" y="430" width="230" height="80" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
    <text x="220" y="477">Void authorization</text>
    <rect x="395" y="430" width="230" height="80" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
    <text x="510" y="477">Release inventory</text>
    <rect x="685" y="430" width="230" height="80" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
    <text x="800" y="477">Cancel label</text>
  </g>

  <!-- Failure path and undo arrows (right to left) -->
  <path d="M1090,320 V470 H917" fill="none" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <g stroke="#DC2626" stroke-width="2.5" marker-end="url(#arrowRed)">
    <line x1="685" y1="470" x2="627" y2="470"/>
    <line x1="395" y1="470" x2="337" y2="470"/>
  </g>
  <text x="1110" y="420" font-size="18" font-weight="600" fill="#DC2626">If a step fails:</text>
  <text x="1110" y="444" font-size="18" fill="#DC2626">undo runs newest first</text>

  <!-- Demo markers -->
  <g font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <circle cx="1487" cy="232" r="22" fill="#16A34A"/>
    <text x="1487" y="240">1</text>
    <circle cx="1197" cy="232" r="22" fill="#DC2626"/>
    <text x="1197" y="240">2</text>
    <circle cx="617" cy="232" r="22" fill="#D97706"/>
    <text x="617" y="240">3</text>
    <circle cx="907" cy="232" r="22" fill="#7C3AED"/>
    <text x="907" y="240">4</text>
  </g>

  <!-- Legend -->
  <g font-size="17" fill="#334155">
    <circle cx="82" cy="624" r="18" fill="#16A34A"/>
    <text x="82" y="631" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="110" y="631" font-size="20" font-weight="700" fill="#0F172A">Happy path</text>
    <text x="110" y="661">Every step succeeds.</text>
    <text x="110" y="685">Order CONFIRMED.</text>

    <circle cx="457" cy="624" r="18" fill="#DC2626"/>
    <text x="457" y="631" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="485" y="631" font-size="20" font-weight="700" fill="#0F172A">Saga compensation</text>
    <text x="485" y="661">Capture declined: label cancelled,</text>
    <text x="485" y="685">stock released, payment voided.</text>

    <circle cx="832" cy="624" r="18" fill="#D97706"/>
    <text x="832" y="631" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="860" y="631" font-size="20" font-weight="700" fill="#0F172A">Worker crash</text>
    <text x="860" y="661">Worker killed mid-order: a new</text>
    <text x="860" y="685">worker carries on from that step.</text>

    <circle cx="1207" cy="624" r="18" fill="#7C3AED"/>
    <text x="1207" y="631" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="1235" y="631" font-size="20" font-weight="700" fill="#0F172A">Shipping timeout</text>
    <text x="1235" y="661">Label created, reply lost: the retry</text>
    <text x="1235" y="685">finds it. Still exactly one label.</text>
  </g>

  <!-- Where it runs -->
  <rect x="290" y="770" width="460" height="64" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <text x="520" y="798" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle">This laptop</text>
  <text x="520" y="822" font-size="16" fill="#475569" text-anchor="middle">Worker + fake payment, inventory, shipping</text>
  <line x1="752" y1="802" x2="848" y2="802" stroke="#475569" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="850" y="770" width="460" height="64" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <text x="1080" y="798" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle">Temporal Cloud</text>
  <text x="1080" y="822" font-size="16" fill="#475569" text-anchor="middle">Durable order state, timers, retries</text>
</svg>
